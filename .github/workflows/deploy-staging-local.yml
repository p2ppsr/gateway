name: Deploy Staging Local Kubernetes

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional master commit SHA to deploy instead of the latest successful CI run
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-staging-local
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'master')
    runs-on:
      - self-hosted
      - gateway-local-deploy
      - private-production-local-deploy
      - linux-amd64
      - docker
      - kubectl
      - local-registry
    environment: staging
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_sha || github.event.workflow_run.head_sha || github.sha }}
      REGISTRY_PUSH: ${{ vars.LOCAL_REGISTRY_PUSH || '10.152.183.28:5000' }}
      REGISTRY_PULL: ${{ vars.LOCAL_REGISTRY_PULL || 'registry.cars-operator-system.svc.cluster.local:5000' }}
      KUBECTL: ${{ vars.LOCAL_KUBECTL || 'kubectl' }}
      WAIT_FOR_CERT: "false"
      SERVER_PRIVATE_KEY: ${{ secrets.STAGING_SERVER_PRIVATE_KEY }}
      SQL_DATABASE_HOST: ${{ secrets.STAGING_SQL_DATABASE_HOST }}
      SQL_DATABASE_PORT: ${{ secrets.STAGING_SQL_DATABASE_PORT }}
      SQL_DATABASE_USER: ${{ secrets.STAGING_SQL_DATABASE_USER }}
      SQL_DATABASE_PASSWORD: ${{ secrets.STAGING_SQL_DATABASE_PASSWORD }}
      SQL_DATABASE_DB_NAME: ${{ secrets.STAGING_SQL_DATABASE_DB_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Checkout deploy SHA
        run: git checkout --detach "${SOURCE_SHA}"
      - name: Local deploy preflight
        run: |
          set -euo pipefail
          docker version
          "${KUBECTL}" version --client
          "${KUBECTL}" get nodes -o wide
      - name: Build and publish staging image
        id: build
        run: |
          set -euo pipefail
          ENVIRONMENT=staging scripts/k8s/build-local-image.sh
      - name: Deploy staging to local Kubernetes
        run: |
          set -euo pipefail
          ENVIRONMENT=staging IMAGE_TAG="${{ steps.build.outputs.image_tag }}" WAIT_FOR_CERT="${WAIT_FOR_CERT}" scripts/k8s/deploy-local.sh
      - uses: actions/upload-artifact@v4
        with:
          name: local-release-manifest-staging-${{ steps.build.outputs.image_tag }}
          path: release-manifest.json
      - name: Deployment summary
        run: |
          {
            echo "### Staging local deployment"
            echo ""
            echo "- Commit: \`${SOURCE_SHA}\`"
            echo "- Image tag: \`${{ steps.build.outputs.image_tag }}\`"
            echo "- Image: \`${{ steps.build.outputs.image }}\`"
            echo "- Namespace: \`gateway-staging\`"
          } >> "$GITHUB_STEP_SUMMARY"
