name: Retired Cloud Run Rollback

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RETIRED-CLOUD-RUN-ROLLBACK to acknowledge that local Kubernetes is the primary deployment path.
        required: true
        type: string

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Retired deployment path
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm }}" != "RETIRED-CLOUD-RUN-ROLLBACK" ]; then
            echo "Cloud Run deployment is retired. Use the local Kubernetes workflows."
            exit 1
          fi
          echo "This workflow is intentionally retired. Restore a known-good historical workflow only for an explicit rollback plan."
