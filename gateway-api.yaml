apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: 
  labels:
    cloud.googleapis.com/location: us-west1
spec:
  template:
    spec:
      timeoutSeconds: 3540
      containers:
      - image: 
        ports:
        - name: h2c
          containerPort: 8080
        resources:
          limits:
            memory: 4Gi
        env:
        - name: NODE_ENV
          value: ''
        - name: BSV_NETWORK
          value: ''
        - name: ROUTING_PREFIX
          value: ''
        - name: SERVER_PRIVATE_KEY
          value: ''
        - name: HOSTING_DOMAIN
          value: ''
        - name: SPAWN_NGINX
          value: ''
        - name: SQL_DATABASE_HOST
          value: ''
        - name: SQL_DATABASE_PORT
          value: ''
        - name: SQL_DATABASE_USER
          value: ''
        - name: SQL_DATABASE_PASSWORD
          value: ''
        - name: SQL_DATABASE_DB_NAME
          value: ''
        - name: HTTP_PORT
          value: ''
