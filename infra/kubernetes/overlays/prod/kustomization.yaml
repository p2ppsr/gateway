apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gateway-prod

resources:
  - namespace.yaml
  - ../../base

images:
  - name: gateway-app
    newName: registry.cars-operator-system.svc.cluster.local:5000/p2ppsr/gateway
    newTag: local

configMapGenerator:
  - name: gateway-app-config
    behavior: merge
    literals:
      - BSV_NETWORK=mainnet
      - HOSTING_DOMAIN=https://app.gateway.cash
      - WALLET_STORAGE_URL=http://wallet-storage.wallet-storage-prod.svc.cluster.local:8080
      - SQL_DATABASE_DB_NAME=gateway

patches:
  - target:
      kind: Deployment
      name: gateway-app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 4Gi
  - target:
      kind: Ingress
      name: gateway-app
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts
        value:
          - app.gateway.cash
      - op: replace
        path: /spec/rules
        value:
          - host: app.gateway.cash
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: gateway-app
                      port:
                        number: 8080
  - target:
      kind: Certificate
      name: gateway-app-tls
    patch: |-
      - op: replace
        path: /spec/dnsNames
        value:
          - app.gateway.cash
